# Copy this file to .github/workflows/refresh.yml to switch on the daily pulse snapshot.
name: Refresh pulse snapshot

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-pulse
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the latest headlines
        run: node scripts/refresh.mjs
      - name: Commit the snapshot if it changed
        run: |
          git config user.name "digi-tech-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/pulse.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Refresh pulse snapshot"
            git push
          fi
      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request was not accepted; the next push will rebuild."
