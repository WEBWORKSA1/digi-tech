---
layout: default
---
<div class='wrap page{% if page.wide %} page-wide{% endif %}'>
  <header class='page-head'>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class='lede'>{{ page.summary }}</p>{% endif %}
    <div class='bits' data-bits='{{ page.title | slice: 0 }}' aria-hidden='true'></div>
  </header>
  <div class='prose'>
{{ content }}
  </div>
</div>
